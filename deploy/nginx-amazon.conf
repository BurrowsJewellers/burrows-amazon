# Add inside the existing dashboard.burrowsjewellers.com.au server block, beside the
# /ring-builder/ and /api/ entries it already has. Nothing else needs to change:
# same domain, same certificate, same login the rest of the dashboard uses.

location ^~ /amazon/api/ {
    proxy_pass http://127.0.0.1:3200/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location ^~ /amazon/ {
    proxy_pass http://127.0.0.1:3200/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
